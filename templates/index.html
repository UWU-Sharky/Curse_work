<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Численное исследование маргинальных распределений</title>
    <!-- Подключаем Tailwind CSS для красивой сетки -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Кастомные стили оформления полей ввода -->
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <!-- Библиотека Chart.js для визуализации распределений -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="bg-slate-50 min-h-screen text-slate-800">
    <div class="max-w-7xl mx-auto px-4 py-8">

        <div class="grid grid-cols-1 lg:grid-cols-4 gap-8">
            
            <!-- Левая панель: Ввод параметров -->
            <div class="lg:col-span-1 bg-white p-6 rounded-2xl shadow-sm border border-slate-100 flex flex-col justify-between">
                <div>
                    <h2 class="text-xl font-bold text-slate-900 border-b border-slate-100 pb-3 mb-4">Параметры модели</h2>
                    
                    <form id="parametersForm" class="space-y-4">
                        <div class="grid grid-cols-2 gap-4">
                            <div>
                                <label for="lam" class="input-label">Входящий поток (λ)</label>
                                <input type="number" id="lam" name="lam" value="5" step="0.1" min="0.1" required>
                            </div>
                            <div>
                                <label for="mu" class="input-label">Обслуживание (μ)</label>
                                <input type="number" id="mu" name="mu" value="1.5" step="0.1" min="0.1" required>
                            </div>
                        </div>

                        <div class="pt-2 border-t border-slate-100">
                            <h3 class="text-xs font-semibold text-slate-400 uppercase tracking-wider mb-3">Коэффициенты переходов</h3>
                            
                            <!-- Узел 1 -->
                            <div class="space-y-2 mb-4">
                                <span class="text-xs font-bold text-slate-500">Из Узла 1</span>
                                <div class="grid grid-cols-2 gap-4">
                                    <div>
                                        <label class="input-label-sub">α10</label>
                                        <input type="number" name="a10" value="0.5" step="0.1" min="0">
                                    </div>
                                    <div>
                                        <label class="input-label-sub">α12</label>
                                        <input type="number" name="a12" value="3.0" step="0.1" min="0">
                                    </div>
                                </div>
                            </div>

                            <!-- Узел 2 -->
                            <div class="space-y-2 mb-4">
                                <span class="text-xs font-bold text-slate-500">Из Узла 2</span>
                                <div class="grid grid-cols-3 gap-2">
                                    <div>
                                        <label class="input-label-sub">α20</label>
                                        <input type="number" name="a20" value="0.5" step="0.1" min="0">
                                    </div>
                                    <div>
                                        <label class="input-label-sub">α21</label>
                                        <input type="number" name="a21" value="1.0" step="0.1" min="0">
                                    </div>
                                    <div>
                                        <label class="input-label-sub">α23</label>
                                        <input type="number" name="a23" value="2.0" step="0.1" min="0">
                                    </div>
                                </div>
                            </div>

                            <!-- Узел 3 -->
                            <div class="space-y-2">
                                <span class="text-xs font-bold text-slate-500">Из Узла 3</span>
                                <div class="grid grid-cols-2 gap-4">
                                    <div>
                                        <label class="input-label-sub">α30</label>
                                        <input type="number" name="a30" value="1.0" step="0.1" min="0">
                                    </div>
                                    <div>
                                        <label class="input-label-sub">α32</label>
                                        <input type="number" name="a32" value="0.5" step="0.1" min="0">
                                    </div>
                                </div>
                            </div>
                        </div>
                    </form>
                </div>

            </div>

            <!-- Правая панель: График и управление отображением -->
           <div class="lg:col-span-3 space-y-6">
                <div class="flex flex-col gap-6 max-w-3xl w-full">
                    
                    <!-- График Узла 1 -->
                    <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-100 flex flex-col h-[350px]">
                        <div class="border-b border-slate-100 pb-2 mb-3 flex justify-between items-center">
                            <div>
                                <h2 class="text-base font-bold text-blue-600">Узел 1</h2>
                            </div>
                        </div>
                        <div class="relative flex-grow w-full">
                            <canvas id="chartNode1"></canvas>
                        </div>
                    </div>

                    <!-- График Узла 2 -->
                    <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-100 flex flex-col h-[350px]">
                        <div class="border-b border-slate-100 pb-2 mb-3 flex justify-between items-center">
                            <div>
                                <h2 class="text-base font-bold text-red-600">Узел 2</h2>
                            </div>
                        </div>
                        <div class="relative flex-grow w-full">
                            <canvas id="chartNode2"></canvas>
                        </div>
                    </div>

                    <!-- График Узла 3 -->
                    <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-100 flex flex-col h-[350px]">
                        <div class="border-b border-slate-100 pb-2 mb-3 flex justify-between items-center">
                            <div>
                                <h2 class="text-base font-bold text-emerald-600">Узел 3</h2>
                            </div>
                        </div>
                        <div class="relative flex-grow w-full">
                            <canvas id="chartNode3"></canvas>
                        </div>
                    </div>

                </div>
            </div>

        </div>
    </div>

    <script src="{{ url_for('static', filename='script.js') }}" defer></script>
</body>
</html>
